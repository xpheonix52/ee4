# One-click hosting on Render (https://render.com): New > Blueprint > pick this repo.
# Needs a paid instance because WhatsApp sessions and the database live on a persistent disk.
services:
  - type: web
    name: switchboard
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /data
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
    disk:
      name: switchboard-data
      mountPath: /data
      sizeGB: 1
