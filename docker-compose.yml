services:
  switchboard:
    build: .
    restart: unless-stopped
    ports:
      # With HTTPS enabled (scripts/enable-https.sh) the app is only reachable through the HTTPS proxy.
      - "${APP_BIND:-0.0.0.0}:3000:3000"
    volumes:
      - switchboard-data:/data   # database, WhatsApp logins, media and backups live here
    environment:
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      TRUST_PROXY: "${TRUST_PROXY:-0}"

volumes:
  switchboard-data:
