# Adds automatic HTTPS in front of the app. Enabled by scripts/enable-https.sh, which writes .env.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?run scripts/enable-https.sh first}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # certificates
      - caddy-config:/config
    depends_on:
      - switchboard

volumes:
  caddy-data:
  caddy-config:
